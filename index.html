<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    .weather-card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 40px;
      width: 400px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .search { display: flex; gap: 8px; margin-bottom: 24px; }
    .search input {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      background: rgba(255,255,255,0.2);
      color: #fff;
      outline: none;
    }
    .search input::placeholder { color: rgba(255,255,255,0.6); }
    .search button {
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.25);
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .search button:hover { background: rgba(255,255,255,0.35); }
    .location-button { padding: 12px 14px !important; }
    .temp { font-size: 3.5rem; font-weight: 700; margin: 16px 0; }
    .desc { font-size: 1.3rem; text-transform: capitalize; opacity: 0.9; }
    .city { font-size: 1.5rem; margin-bottom: 8px; }
    .details { display: flex; justify-content: space-around; margin-top: 24px; }
    .detail-item { text-align: center; }
    .detail-item .label { font-size: 0.8rem; opacity: 0.7; margin-bottom: 4px; }
    .detail-item .value { font-size: 1.1rem; font-weight: 600; }
    .error { color: #ff6b6b; margin-top: 12px; font-size: 0.9rem; }
    .forecast { display: flex; gap: 8px; margin-top: 24px; overflow-x: auto; }
    .forecast-day {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px 8px;
      min-width: 60px;
      font-size: 0.8rem;
    }
    .forecast-day .day-name { opacity: 0.7; margin-bottom: 4px; }
    .forecast-day .day-temp { font-weight: 600; font-size: 1rem; }
    .loading { opacity: 0.5; }
  </style>
</head>
<body>
  <div class="weather-card" id="card">
    <div class="search">
      <input type="text" id="cityInput" placeholder="Search city..." onkeydown="if(event.key==='Enter') searchWeather()">
      <button onclick="searchWeather()">🔍</button>
      <button class="location-button" onclick="useMyLocation()" title="Use my current location" aria-label="Use my current location">📍</button>
    </div>
    <div id="error" class="error" style="display:none;"></div>
    <div id="weather" style="display:none;">
      <div class="city" id="cityName"></div>
      <div class="temp" id="temperature"></div>
      <div class="desc" id="description"></div>
      <div class="details">
        <div class="detail-item">
          <div class="label">Humidity</div>
          <div class="value" id="humidity"></div>
        </div>
        <div class="detail-item">
          <div class="label">Wind</div>
          <div class="value" id="wind"></div>
        </div>
        <div class="detail-item">
          <div class="label">Feels Like</div>
          <div class="value" id="feelsLike"></div>
        </div>
      </div>
      <div class="forecast" id="forecast"></div>
    </div>
  </div>
  <script>
    async function searchWeather(cityOverride) {
      const city = (cityOverride || document.getElementById('cityInput').value).trim();
      if (!city) return;
      document.getElementById('error').style.display = 'none';
      document.getElementById('card').classList.add('loading');
      try {
        // Geocode the city
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
        const geoData = await geoRes.json();
        if (!geoData.results || geoData.results.length === 0) {
          throw new Error('City not found');
        }
        const { latitude, longitude, name, country } = geoData.results[0];
        // Fetch weather
        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto&forecast_days=5`);
        const weatherData = await weatherRes.json();
        // Display current weather
        document.getElementById('cityName').textContent = `${name}, ${country}`;
        document.getElementById('temperature').textContent = `${Math.round(weatherData.current.temperature_2m)}°C`;
        document.getElementById('description').textContent = weatherCodeToText(weatherData.current.weather_code);
        document.getElementById('humidity').textContent = `${weatherData.current.relative_humidity_2m}%`;
        document.getElementById('wind').textContent = `${Math.round(weatherData.current.wind_speed_10m)} km/h`;
        document.getElementById('feelsLike').textContent = `${Math.round(weatherData.current.apparent_temperature)}°C`;
        // Forecast
        const forecastEl = document.getElementById('forecast');
        forecastEl.innerHTML = '';
        const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        for (let i = 0; i < weatherData.daily.time.length; i++) {
          const date = new Date(weatherData.daily.time[i]);
          const dayName = i === 0 ? 'Today' : days[date.getDay()];
          forecastEl.innerHTML += `<div class="forecast-day"><div class="day-name">${dayName}</div><div class="day-temp">${Math.round(weatherData.daily.temperature_2m_max[i])}°</div></div>`;
        }
        document.getElementById('weather').style.display = 'block';
      } catch (err) {
        document.getElementById('error').textContent = err.message;
        document.getElementById('error').style.display = 'block';
        document.getElementById('weather').style.display = 'none';
      }
      document.getElementById('card').classList.remove('loading');
    }

    function useMyLocation() {
      const errorEl = document.getElementById('error');
      if (!navigator.geolocation) {
        errorEl.textContent = 'Location is not supported by this browser.';
        errorEl.style.display = 'block';
        return;
      }
      errorEl.style.display = 'none';
      document.getElementById('card').classList.add('loading');
      navigator.geolocation.getCurrentPosition(async ({ coords }) => {
        try {
          const reverseRes = await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${coords.latitude}&longitude=${coords.longitude}&count=1`);
          const place = await reverseRes.json();
          const result = place.results && place.results[0];
          if (!result) throw new Error('Could not identify your location');
          document.getElementById('cityInput').value = result.name;
          await searchWeather(result.name);
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.style.display = 'block';
        } finally {
          document.getElementById('card').classList.remove('loading');
        }
      }, () => {
        document.getElementById('card').classList.remove('loading');
        errorEl.textContent = 'Location permission was denied. Search for a city instead.';
        errorEl.style.display = 'block';
      }, { enableHighAccuracy: true, timeout: 10000 });
    }

    function weatherCodeToText(code) {
      const map = {0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Foggy',48:'Rime fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',80:'Showers',81:'Showers',82:'Heavy showers',95:'Thunderstorm',96:'Thunderstorm + hail',99:'Thunderstorm + heavy hail'};
      return map[code] || 'Unknown';
    }

    // Default city
    document.getElementById('cityInput').value = 'Karachi';
    searchWeather();
  </script>
</body>
</html>
